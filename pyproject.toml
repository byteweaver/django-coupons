[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-coupons"
version = "2.0.0a1"
description = "A reusable Django application for coupon generation and redemption."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "byteweaver", email = "contact@byteweaver.net" },
]
dependencies = [
  "Django>=5.2,<6.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/byteweaver/django-coupons"
Issues = "https://github.com/byteweaver/django-coupons/issues"

[dependency-groups]
dev = [
  "coverage[toml]>=7.15",
  "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["coupons"]

[tool.hatch.build.targets.sdist]
include = ["/coupons", "/CHANGELOG.md", "/CONTRIBUTORS.md", "/LICENSE", "/README.md"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["coupons/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.coverage.run]
branch = true
source = ["coupons"]
omit = ["coupons/migrations/*", "coupons/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
