name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            django: "~=5.2.0"
          - python: "3.13"
            django: "~=6.0.0"
          - python: "3.14"
            django: "~=6.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv pip install "Django${{ matrix.django }}"
      - run: uv run coverage run -m django test --settings=coupons.tests.settings
      - run: uv run coverage report
      - run: uv run django-admin check --settings=coupons.tests.settings
      - run: uv run django-admin makemigrations --check --dry-run --settings=coupons.tests.settings

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - run: uv run --with twine twine check dist/*
